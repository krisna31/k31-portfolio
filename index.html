<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = stored === 'dark' || (!stored && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', 'light');
          }
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jelvin Krisna Putra | Full Stack Web Developer</title>
    <meta name="description" content="Portfolio of Jelvin Krisna Putra - Full Stack Web Developer, Google Associate Cloud Engineer, and TensorFlow Developer." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
